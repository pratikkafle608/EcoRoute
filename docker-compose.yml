services:
  backend:
    build:
      context: .
      dockerfile: demo/Dockerfile
    image: ecoroute-backend
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 8080
    # Not published to the host: only reachable through the frontend's /api proxy
    expose:
      - "8080"
    # Any HTTP response (even 404) means Spring finished booting and the DB pool is up
    healthcheck:
      test: ["CMD", "curl", "-s", "-o", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s

  frontend:
    build:
      context: ./ecoroute-frontend
    image: ecoroute-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
