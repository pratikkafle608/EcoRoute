# Server Configuration
# Render (and most PaaS hosts) inject the port to bind to via $PORT.
server.port=${PORT:8080}

# 1. Database Connection URL
# Supabase's *direct* host (db.<project-ref>.supabase.co) is IPv6-only on most
# projects, which times out on IPv4-only networks. Use the Session pooler host
# instead (Project Settings -> Database -> Connection string -> "Session pooler"),
# e.g. aws-0-<region>.pooler.supabase.com:5432. Fill in your actual region below.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://aws-1-us-west-2.pooler.supabase.com:5432/postgres?sslmode=require}

# 2. Driver Class Name
spring.datasource.driverClassName=org.postgresql.Driver

# 3. Credentials (set these as real environment variables - do not hardcode here)
# NOTE: the pooler requires the project-ref-qualified username, not plain "postgres".
spring.datasource.username=${SUPABASE_DB_USER:postgres.skbzngzwvfhkyxdpeckd}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}

# Supabase's Session pooler caps the whole project at 15 client connections, shared by
# every running instance (Render, self-hosted server, local dev). Hikari's default of 10
# per instance lets two instances starve a third (FATAL: EMAXCONNSESSION), so keep it small.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=60000

# 4. Hibernate / JPA Properties
# Dialect is auto-detected from the JDBC connection
# All relations are eagerly fetched, so no lazy loading is needed during JSON rendering
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true


# Third-Party API Base URLs
maptiler.api.url=https://api.maptiler.com/
# Driving distance; the public OSRM demo server is free but rate-limited - point at a self-hosted OSRM for heavy use
osrm.api.url=${OSRM_API_URL:https://router.project-osrm.org/}
climatiq.api.url=https://api.climatiq.io/v1/

# API Keys (set as real environment variables - do not hardcode here)
maptiler.api.key=${MAPTILER_API_KEY:}
climatiq.api.key=${CLIMATIQ_API_KEY:}
spring.ai.openai.api-key=${OPENAI_API_KEY:}
spring.ai.openai.chat.options.model=gpt-4o