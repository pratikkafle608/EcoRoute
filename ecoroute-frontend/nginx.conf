# Per-IP request budgets (this file is included in nginx's http block, so zones can live here).
# Spring keeps its own per-IP/per-user/global limits behind these; nginx just drops floods cheaply.
limit_req_zone  $binary_remote_addr zone=auth:10m rate=10r/m;
limit_req_zone  $binary_remote_addr zone=calc:10m rate=6r/m;
limit_req_zone  $binary_remote_addr zone=api:10m  rate=10r/s;
limit_conn_zone $binary_remote_addr zone=perip:10m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Tailscale Funnel reaches us via the Docker bridge, so every visitor shows up as the gateway IP.
    # Take the client IP from X-Forwarded-For, but only when the hop handing it over is local
    # (loopback or a Docker network) - a direct client can't spoof it.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Small bodies and short timeouts, so slow or oversized junk requests can't hold connections
    client_max_body_size 16k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn perip 20;

    limit_req_status 429;
    limit_conn_status 429;
    # Same JSON shape as Spring's 429, which the frontend shows to the user
    error_page 429 = @too_many;
    location @too_many {
        default_type application/json;
        add_header Retry-After 60 always;
        return 429 '{"error":"Too many requests. Please wait a minute and try again."}';
    }

    # Inherited by every /api location below.
    # $http_host keeps the port, so Spring sees browser requests as same-origin (CORS)
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;

    # API calls go to the Spring Boot container (service name "backend" in docker-compose.yml)
    location = /api/login {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    location = /api/signup {
        limit_req zone=auth burst=10 nodelay;
        proxy_pass http://backend:8080;
    }

    # Spends paid OpenAI/Climatiq calls
    location = /api/routes/calculate {
        limit_req zone=calc burst=4 nodelay;
        proxy_pass http://backend:8080;
    }

    location /api/ {
        limit_req zone=api burst=30 nodelay;
        proxy_pass http://backend:8080;
    }

    # Hashed build assets can be cached forever
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback; index.html must be revalidated so browsers pick up new asset hashes after a rebuild
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
